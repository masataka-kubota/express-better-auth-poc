name: Deploy backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "chore/36-secret"
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-cloudrun-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME }}
  IMAGE_NAME: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/backend/backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: 🏗 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 #v2.2.0

      - name: 📦 Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: ✅ Verify backend
        working-directory: apps/backend
        run: bun run type-check && bun run test

      - name: 🐳 Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 🏗 Build and push backend image
        working-directory: apps/backend
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 🗄️ Run database migrations
        working-directory: apps/backend
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:migrate

      - name: 🔐 Sync runtime secrets to Secret Manager
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail

          ensure_secret() {
            local secret_name="$1"
            local secret_value="$2"

            if [ -z "$secret_value" ]; then
              echo "Missing required secret value for $secret_name" >&2
              exit 1
            fi

            if ! gcloud secrets describe "$secret_name" --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              gcloud secrets create "$secret_name" \
                --project="${{ env.PROJECT_ID }}" \
                --replication-policy=automatic
            fi

            printf '%s' "$secret_value" | gcloud secrets versions add "$secret_name" \
              --project="${{ env.PROJECT_ID }}" \
              --data-file=- >/dev/null
          }

          ensure_secret "BETTER_AUTH_SECRET" "$BETTER_AUTH_SECRET"
          ensure_secret "DATABASE_URL" "$DATABASE_URL"
          ensure_secret "RESEND_API_KEY" "$RESEND_API_KEY"

      - name: 🚀 Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=NODE_ENV=production,BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }},SMTP_FROM=${{ vars.SMTP_FROM }},FRONTEND_URLS=${{ vars.FRONTEND_URLS }} \
            --set-secrets=BETTER_AUTH_SECRET=latest,DATABASE_URL=latest,RESEND_API_KEY=latest
